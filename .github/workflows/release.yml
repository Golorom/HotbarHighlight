name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  ADDON: HotbarHighlight

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Run the tests
        run: lua5.1 tests/run.lua
      - name: Check that the tag matches the TOC version
        run: |
          version="$(sed -n 's/^## Version: *//p' "$ADDON.toc" | tr -d '\r')"
          echo "TOC version: $version, tag: $GITHUB_REF_NAME"
          test "v$version" = "$GITHUB_REF_NAME"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build the zip
        run: git archive --format=zip --prefix="$ADDON/" -o "$ADDON-$GITHUB_REF_NAME.zip" HEAD
      - name: Take the release notes from the changelog
        run: |
          awk -v head="## $VERSION" 'index($0, head) == 1 { on = 1; next } /^## / && on { exit } on' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$ADDON-$GITHUB_REF_NAME.zip" --title "Hotbar Highlight $GITHUB_REF_NAME" --notes-file notes.md
